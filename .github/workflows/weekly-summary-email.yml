name: RUDY Weekly Summary Email

# Triggered by cron-job.org webhook every Friday 17:00 IDT
# (No schedule: trigger - relies on cron-job.org for accurate timing
#  GitHub Actions cron has 2-6hr delay, unusable)
#
# Manual test: Go to Actions → Run workflow → set dry_run=true → Run
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, do not send emails)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Force re-send even if already sent this week'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-weekly-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci || npm install

      - name: Send weekly summary email
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: node weekly-summary-email.js
