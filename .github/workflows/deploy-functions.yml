name: 🚀 Deploy Cloud Functions (manual only)

# Deploys functions/ to Firebase using the existing FIREBASE_SERVICE_KEY
# service account — so the owner can deploy from a phone, no computer /
# no `firebase login` needed.
#
# PREREQUISITE: the Firebase project must be on the Blaze plan (Cloud
# Functions require it). Enable once at:
#   https://console.firebase.google.com/project/timetrack-63654/usage/details
#
# Run: GitHub → Actions → "🚀 Deploy Cloud Functions" → Run workflow.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function deps
        working-directory: functions
        run: npm install

      - name: Write service account to file
        run: echo '${{ secrets.FIREBASE_SERVICE_KEY }}' > "$HOME/sa.json"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/sa.json
        run: npx firebase-tools deploy --only functions --project timetrack-63654 --non-interactive
