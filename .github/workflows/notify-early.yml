name: Notify - Early Reminder

on:
  schedule:
    # 05:45 Israel time. Both seasons are scheduled so no DST edit is needed:
    #   02:45 UTC = 05:45 IDT (summer) · 03:45 UTC = 05:45 IST (winter)
    # check-early-reminder.js sends only in the 45 min before work start
    # (Israel time), once per day; the off-season run just skips.
    # (Was '45 22 * * *' = 5:45 Bangkok = 01:45 in Israel.)
    - cron: '45 2 * * *'
    - cron: '45 3 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Run check-early-reminder
        working-directory: scripts
        env:
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: node check-early-reminder.js
