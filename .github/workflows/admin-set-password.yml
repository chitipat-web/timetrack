name: 🔑 Set User Password (manual only)

# Manually reset any RUDY user's login password from a phone.
# GitHub → Actions → "🔑 Set User Password" → Run workflow → fill inputs.
# Uses the existing FIREBASE_SERVICE_KEY (Admin SDK) — same secret the
# notification workflows use.

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'User email (e.g. lenghlx1@gmail.com)'
        required: true
        type: string
      new_password:
        description: 'New password (at least 6 characters)'
        required: true
        type: string

jobs:
  set-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Set the password
        working-directory: scripts
        env:
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          TARGET_EMAIL: ${{ inputs.email }}
          NEW_PASSWORD: ${{ inputs.new_password }}
        run: node admin-set-password.js
