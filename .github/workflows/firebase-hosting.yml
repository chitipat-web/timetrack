name: Firebase Hosting (rudyhr.web.app)

# Publishes the app to Firebase Hosting next to GitHub Pages, so it also lives at
# https://rudyhr.web.app (site id in firebase.json; "rudy" is taken). Same files, same Firebase data;
# GitHub Pages keeps serving the old link.
# Runs on every push to main that touches the web files or this setup, or by
# hand (Actions → Run workflow). The site is created on the first run if it
# doesn't exist yet.
# Needs FIREBASE_SERVICE_KEY (the same service-account JSON the email scripts use);
# that account must be allowed to deploy Hosting (role: Firebase Hosting Admin).

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'manifest.json'
      - 'splash.mp4'
      - '*.png'
      - '*.html'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_CLI: firebase-tools@15.32.1
      PROJECT: timetrack-63654
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Service account
        env:
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_KEY" ]; then echo "❌ Missing required secrets: FIREBASE_SERVICE_KEY"; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Make sure the site exists
        run: |
          SITE="$(node -p "require('./firebase.json').hosting.site")"
          if npx --yes "$FIREBASE_CLI" hosting:sites:get "$SITE" --project "$PROJECT" --non-interactive; then
            echo "✅ site $SITE exists"
          else
            echo "site $SITE not found in $PROJECT — creating it"
            npx --yes "$FIREBASE_CLI" hosting:sites:create "$SITE" --project "$PROJECT" --non-interactive
          fi

      - name: Collect web files
        run: |
          mkdir -p _site
          cp index.html sw.js version.json manifest.json splash.mp4 _site/
          cp icon-*.png _site/
          for f in privacy.html cache-clear.html force-resubscribe.html; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          ls -la _site

      - name: Deploy
        run: |
          MSG="$(git log -1 --pretty=%s | cut -c1-100)"
          npx --yes "$FIREBASE_CLI" deploy --only hosting --project "$PROJECT" --non-interactive --message "$MSG"
