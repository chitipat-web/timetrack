name: Notify - No Checkout

on:
  schedule:
    # 22:00 Israel time. Both seasons are scheduled so no DST edit is needed:
    #   19:00 UTC = 22:00 IDT (summer) · 20:00 UTC = 22:00 IST (winter)
    # check-no-checkout.js sends only 22:00-24:00 Israel time, once per day.
    # (Was '0 15 * * *' = 22:00 Bangkok = 18:00 in Israel.)
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Run check-no-checkout
        working-directory: scripts
        env:
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: node check-no-checkout.js
