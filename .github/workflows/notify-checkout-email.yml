name: 📧 Check-out Email Reminder (22:00 IDT)

on:
  schedule:
    # 22:00 IDT (Israel Summer Time) = 19:00 UTC
    # ⚠️ Winter (IST, UTC+2): change to '0 20 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Send check-out reminder
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
        run: node notify-checkout-email.js
