name: RUDY Check-out Email Reminder

# Triggered by cron-job.org webhook at 22:00 IDT
# (No schedule: trigger to avoid double-send)
on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci || npm install

      - name: Send check-out email
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node notify-checkout-email.js

      # Push reminder piggybacks on this on-time trigger: GitHub's own cron for
      # notify-checkout runs hours late and always fell outside the Israel-time
      # window (logs: "Outside ... window — skipping"). The script still checks
      # the window itself and sends at most once per Israel day (pushlog lock).
      - name: Send push reminder (no-checkout)
        if: always()
        continue-on-error: true
        working-directory: scripts
        env:
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORCE: 'false'
        run: node check-no-checkout.js
