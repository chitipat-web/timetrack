name: 📧 Check-in Email Reminder (5:45 IDT)

on:
  schedule:
    # 5:45 IDT (Israel Summer Time) = 02:45 UTC
    # ⚠️ Winter (IST, UTC+2): change to '45 3 * * *'
    - cron: '45 2 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Send check-in reminder
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
        run: node notify-checkin-email.js
