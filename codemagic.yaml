workflows:
  ios-app-store:
    name: RUDY iOS — App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chitipat.rudy
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      # Only build when an explicit ios-v<n> tag is pushed (so normal web
      # commits don't burn macOS minutes). To ship: `git tag ios-v1.0
      # && git push origin ios-v1.0`.
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Mirror web build into www/
        script: npm run build:web
      - name: Add iOS platform (idempotent)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "ios/ exists, skipping cap add"
          fi
      - name: Sync Capacitor → iOS bundle
        script: npx cap sync ios
      - name: Set build number from Codemagic counter
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        # Uses the App Store Connect API integration configured in
        # Codemagic dashboard → Teams → Integrations
        auth: integration
        # First build goes to TestFlight only. After internal testing
        # is happy, promote to App Store via App Store Connect web UI
        # (or flip submit_to_app_store: true here for full auto-submit).
        submit_to_testflight: true
        # Optional: which TestFlight groups get this build automatically
        # beta_groups:
        #   - "Internal Team"
