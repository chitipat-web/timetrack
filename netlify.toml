# Netlify config — RUDY admin backend only.
# We do NOT serve the app here (GitHub Pages does). Netlify just hosts the
# serverless function at /.netlify/functions/set-password.
# publish points at an empty dir so no static site is built/deployed.

[build]
  functions = "netlify/functions"
  publish = "netlify/empty"
  # Every production deploy costs 15 of the Free plan's 300 monthly credits,
  # and this site used to rebuild on EVERY push to main (each app version
  # bump), hitting 75% in 2 days. Only the function matters here, so skip the
  # build unless the function code or its dependencies changed. Exit 0 =
  # skip (canceled builds use no credits), exit 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ package.json package-lock.json"

[functions]
  node_bundler = "esbuild"
  # firebase-admin is installed from the root package.json dependencies.
  external_node_modules = ["firebase-admin"]
